name: Sync CS Books Catalog

on:
  schedule:
    # Automatically discover new, removed, or renamed PDFs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [books-updated]

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync PDF catalog from GitHub repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-books-catalog.mjs

      - name: Check for catalog changes
        id: changes
        run: |
          if git diff --quiet public/books-catalog.json src/data/books/booksCatalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies & verify build + tests
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit updated catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books-catalog.json src/data/books/booksCatalog.json
          git commit -m "chore(books): sync dynamic PDF catalog from CS-and-Programming-Books"
          git push
